[project]
name = "mini-gpt"
version = "0.1.0"
description = "A small character-level GPT trained from scratch on public-domain Portuguese (Machado de Assis)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-WEIGHTS-AND-DOCS"]
authors = [{ name = "Victor Huggo de Medeiros" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_gpt"]

# PyTorch only for CPU: the model is small and trains in about an hour without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mini_gpt --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
